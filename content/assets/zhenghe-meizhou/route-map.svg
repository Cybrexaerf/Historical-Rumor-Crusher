<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="Noto Serif SC, SimSun, serif" role="img" aria-label="郑和下西洋航线与假想的环球航线对照示意图">
  <rect width="720" height="420" fill="#f4edda"/>
  <rect x="8" y="8" width="704" height="404" fill="none" stroke="#8a6d2f" stroke-width="1.5"/>
  <rect x="14" y="14" width="692" height="392" fill="none" stroke="#8a6d2f" stroke-width="0.5" opacity="0.6"/>

  <text x="360" y="46" text-anchor="middle" font-size="22" font-weight="900" fill="#2b2620">郑和船队航线对照示意图</text>
  <text x="360" y="68" text-anchor="middle" font-size="12" fill="#5a5142">虚线为史料可证的六下西洋范围 · 灰虚线为「1421 环球」假想路线（无史料支撑）</text>

  <!-- 框架经纬（示意） -->
  <g stroke="#8a6d2f" stroke-width="0.5" opacity="0.25">
    <line x1="120" y1="90" x2="120" y2="360"/>
    <line x1="360" y1="90" x2="360" y2="360"/>
    <line x1="600" y1="90" x2="600" y2="360"/>
    <line x1="80" y1="140" x2="680" y2="140"/>
    <line x1="80" y1="230" x2="680" y2="230"/>
    <line x1="80" y1="320" x2="680" y2="320"/>
  </g>

  <!-- 大陆轮廓（高度示意化） -->
  <g fill="#e9dfc4" stroke="#5a5142" stroke-width="1">
    <path d="M 100 120 L 170 110 L 200 130 L 190 180 L 160 210 L 130 200 L 105 170 Z"/>
    <path d="M 480 105 L 560 95 L 610 115 L 620 160 L 590 200 L 540 190 L 500 160 Z"/>
    <path d="M 250 340 L 330 330 L 370 345 L 360 380 L 290 390 Z"/>
    <path d="M 380 300 L 450 295 L 470 320 L 440 345 L 395 335 Z"/>
  </g>
  <g font-size="12" fill="#2b2620">
    <text x="140" y="150">亚洲</text>
    <text x="545" y="140">美洲（假想）</text>
    <text x="290" y="365">东南亚</text>
    <text x="415" y="322">印度洋</text>
  </g>

  <!-- 史料航线：中国沿海—东南亚—印度洋—东非 -->
  <path d="M 165 165 C 220 210, 280 300, 330 350 C 370 330, 420 320, 470 318 C 520 315, 560 330, 575 345"
        fill="none" stroke="#a8352c" stroke-width="3" stroke-dasharray="8 5"/>
  <g fill="#a8352c">
    <circle cx="165" cy="165" r="6"/>
    <circle cx="330" cy="350" r="5"/>
    <circle cx="470" cy="318" r="5"/>
    <circle cx="575" cy="345" r="6"/>
  </g>
  <g font-size="11" fill="#a8352c">
    <text x="150" y="152">南京·刘家港</text>
    <text x="300" y="370">满剌加</text>
    <text x="445" y="305">古里</text>
    <text x="560" y="368">东非·木骨都束</text>
  </g>

  <!-- 假想环球路线 -->
  <path d="M 575 345 C 650 300, 660 200, 600 150 C 560 120, 480 130, 450 160"
        fill="none" stroke="#5a6b7a" stroke-width="2" stroke-dasharray="3 5"/>
  <path d="M 450 160 C 380 130, 300 120, 250 140"
        fill="none" stroke="#5a6b7a" stroke-width="2" stroke-dasharray="3 5"/>
  <text x="470" y="185" font-size="11" fill="#5a6b7a">「横渡太平洋」（无史料）</text>

  <!-- 图例 -->
  <g font-size="12">
    <line x1="100" y1="402" x2="140" y2="402" stroke="#a8352c" stroke-width="3" stroke-dasharray="8 5"/>
    <text x="148" y="406" fill="#2b2620">史料可证航线（《明史》《前闻记》等）</text>
    <line x1="420" y1="402" x2="460" y2="402" stroke="#5a6b7a" stroke-width="2" stroke-dasharray="3 5"/>
    <text x="468" y="406" fill="#2b2620">孟席斯假想路线（伪）</text>
  </g>
</svg>
